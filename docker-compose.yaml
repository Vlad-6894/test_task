services:

  test-task-postgres:
    image: postgres:18.1-bookworm
    container_name: postgres-db
    environment: 
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pg_data:/var/lib/postgresql:z
    restart: always
  
  postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
  
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:test-task-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"